<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz cumpleaños 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--red:#e2574c;--pink:#f6c9d0;--soft:#fff3f5;--ink:#7a3b3b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Patrick Hand',cursive;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff 0,var(--soft) 40%,#f9d9df 100%);overflow-x:hidden}
.page{display:none;min-height:100vh;padding:28px 18px 60px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;animation:in .5s}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-family:'Gochi Hand',cursive;color:var(--red);font-size:clamp(2rem,8vw,3.4rem);margin:0}
p{font-size:1.25rem;margin:0}
.big{font-size:6rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.btn{font:inherit;font-size:1.25rem;color:var(--ink);background:#fff8;border:2px solid var(--pink);border-radius:999px;padding:8px 26px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--pink);transform:scale(1.05)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative}
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:420px}
.gift{background:#fff9;border:2px dashed var(--pink);border-radius:20px;padding:16px;cursor:pointer;font-size:3rem;transition:.2s}
.gift small{display:block;font-size:1.1rem;color:var(--ink)}
.gift:hover{transform:rotate(-3deg) scale(1.05)}
.gift.done{opacity:.55}
@media(max-width:420px){.gift{padding:12px}.big{font-size:5rem}.btn{padding:10px 22px}}
.card{background:#fff;border:3px dotted var(--pink);border-radius:18px;padding:22px;max-width:560px;white-space:pre-line;box-shadow:0 8px 24px #e2574c22}
iframe,video{width:min(92vw,560px);aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
.wall{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:900px}
.wall img{width:min(44vw,220px);padding:8px 8px 22px;background:#fff;border:2px solid var(--pink);border-radius:6px;box-shadow:0 6px 14px #0002;object-fit:cover;aspect-ratio:1}
.wall img:nth-child(odd){transform:rotate(-3deg)}.wall img:nth-child(even){transform:rotate(3deg)}
.reasons{display:grid;gap:10px;max-width:480px;width:100%}
.reasons div{background:var(--pink);border-radius:14px;padding:10px 16px}
.cake{font-size:5rem;position:relative}
.flame{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:2rem;animation:fl .4s infinite alternate}
@keyframes fl{to{transform:translateX(-50%) scale(1.15) rotate(6deg)}}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.hint{font-size:1rem;opacity:.7}
</style></head><body>
<div class="hearts" id="hearts"></div>

<section class="page on" id="p1">
  <h1 data-k="p1Title"></h1><div class="big" data-img="p1">🐶💌</div>
  <p data-k="p1Text"></p>
  <div class="row"><button class="btn" onclick="go('p3')">Sí</button><button class="btn" id="no">No</button></div>
</section>

<section class="page" id="p3">
  <h1 data-k="p3Title"></h1><div class="big" data-img="p3">🐶❤️</div>
  <p data-k="p3Text"></p>
  <button class="btn" onclick="go('p4')">Siguiente</button>
</section>

<section class="page" id="p4">
  <h1 data-k="giftsTitle"></h1>
  <div class="gifts">
    <div class="gift" data-g="song"><span data-img="gsong">🎧</span><small>Canción</small></div>
    <div class="gift" data-g="letter"><span data-img="gletter">💌</span><small>Carta</small></div>
    <div class="gift" data-g="photos"><span data-img="gphotos">📸</span><small>Fotos</small></div>
    <div class="gift" data-g="reasons"><span data-img="greasons">🌹</span><small>Razones</small></div>
  </div>
  <p class="hint">Haz click en cada regalo</p>
  <button class="btn" id="toCake" style="display:none" onclick="go('cake')">Un último detalle 🎂</button>
</section>

<section class="page" id="song"><h1 data-k="songTitle"></h1><div id="yt"></div><div class="card" data-k="songText"></div><button class="btn" onclick="const v=document.querySelector('#yt video');if(v)v.pause();go('p4')">Volver</button></section>
<section class="page" id="letter"><h1 data-k="letterTitle"></h1><div class="card" data-k="letter"></div><button class="btn" onclick="go('p4')">Volver</button></section>
<section class="page" id="photos"><h1 data-k="photosTitle"></h1><div class="wall" id="wall"></div><button class="btn" onclick="go('p4')">Volver</button></section>
<section class="page" id="reasons"><h1 data-k="reasonsTitle"></h1><div class="reasons" id="rs"></div><button class="btn" onclick="go('p4')">Volver</button></section>

<section class="page" id="cake">
  <h1 id="cakeT" data-k="cakeTitle"></h1>
  <div class="cake" data-img="cake">🎂<span class="flame" id="flame">🔥</span></div>
  <button class="btn" id="blow">Soplar 💨</button>
</section>

<script>
const $=id=>document.getElementById(id), seen=new Set();
const DEFAULTS={
 p1Title:"Feliz cumpleaños mi niña",p1Text:"¿Quieres ver el regalo que hice para ti?",
 p3Title:"Te amo mi amor!!!",p3Text:"Este sitio web es solo para ti!",
 giftsTitle:"Regalos para ti!",
 songTitle:"Te dedico esta canción",songYoutubeId:"",songText:"Te dedico esta canción porque cada palabra me hace pensar en ti.",
 letterTitle:"Espero que te guste mi pequeña sorpresa amor",letter:"Feliz cumpleaños. Hoy quiero recordarte lo especial que eres y lo bonito que es tenerte en mi vida.",
 photosTitle:"Mis fotos favoritas 💗",reasonsTitle:"Te mereces todo",
 reasons:["Te amo de aquí hasta el infinito y mucho más.","Eres mi persona favorita en todo el mundo.","Contigo he creado mis recuerdos más bonitos.","Eres mi lugar seguro y mi paz."],
 cakeTitle:"Sopla la vela mi amor!!",cakeEnd:"Feliz cumpleaños, te amo 💗",images:{}};
let C=DEFAULTS;
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
function render(){
  document.querySelectorAll('[data-k]').forEach(e=>e.textContent=C[e.dataset.k]);
  $('rs').innerHTML=''; C.reasons.forEach(r=>{const d=document.createElement('div');d.textContent='💗 '+r;$('rs').appendChild(d)});
  document.querySelectorAll('[data-img]').forEach(e=>{const u=(C.images||{})[e.dataset.img];
    if(u){const fl=e.dataset.img==='cake'?$('flame'):null;const isG=/^g/.test(e.dataset.img);e.innerHTML='';const i=document.createElement('img');i.src=u;i.style.cssText=isG?'display:block;margin:0 auto 6px;width:100%;max-width:110px;height:110px;object-fit:cover;border-radius:14px':'max-width:220px;max-height:220px;border-radius:16px';e.appendChild(i);if(fl){e.style.position='relative';e.appendChild(fl)}e.classList.remove('big')}});
}
fetch('config.json?'+Date.now()).then(r=>r.json()).catch(()=>({})).then(j=>{C={...DEFAULTS,...j,images:{...(j.images||{})}};render()});
fetch('photos.json?'+Date.now()).then(r=>r.json()).then(l=>{
  $('wall').innerHTML=l.length?l.map(s=>`<img src="${s}" loading="lazy" alt="">`).join(''):'<p>Pronto habrá fotos aquí 💗</p>'}).catch(()=>{});
const no=$('no');no.style.position='relative';
function dodge(){no.style.left=(Math.random()*160-80)+'px';no.style.top=(Math.random()*120-60)+'px'}
no.onmouseenter=dodge;no.onclick=dodge;no.ontouchstart=e=>{e.preventDefault();dodge()};
document.querySelectorAll('.gift').forEach(g=>g.onclick=()=>{
  const k=g.dataset.g;
  if(k==='song'&&!$('yt').innerHTML&&C.songVideo)$('yt').innerHTML=`<video src="${C.songVideo}" controls playsinline preload="metadata"></video>`;
  else if(k==='song'&&!$('yt').innerHTML&&C.songYoutubeId)$('yt').innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(C.songYoutubeId)}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
  seen.add(k);g.classList.add('done');if(seen.size>=4)$('toCake').style.display='';go(k)});
function hearts(n=24){for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=['💗','💖','🎉','✨','🎈'][i%5];
  s.style.left=Math.random()*100+'vw';s.style.fontSize=(18+Math.random()*26)+'px';s.style.animationDuration=(3+Math.random()*3)+'s';
  s.style.animationDelay=Math.random()*1.5+'s';$('hearts').appendChild(s);setTimeout(()=>s.remove(),7000)}}
$('blow').onclick=()=>{$('flame').style.display='none';$('cakeT').textContent=C.cakeEnd;$('blow').style.display='none';hearts(60)};
</script></body></html>
